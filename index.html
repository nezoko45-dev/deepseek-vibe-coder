<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek Vibe Coder</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#eee;min-height:100vh}main{max-width:1000px;margin:auto;padding:32px 20px}.card{background:#131720;border:1px solid #292f3b;border-radius:18px;padding:24px;box-shadow:0 12px 40px #0006}h1{margin:0 0 8px;font-size:30px}p{color:#aeb5c2}label{display:block;margin:18px 0 7px;font-weight:700}input,textarea{width:100%;background:#0d1016;color:#fff;border:1px solid #343b49;border-radius:10px;padding:12px;font:inherit}textarea{min-height:180px;resize:vertical}button{margin-top:18px;border:0;border-radius:10px;padding:12px 18px;background:#4d7cff;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.status{margin-top:18px;padding:12px;border-radius:10px;background:#0d1016;white-space:pre-wrap}.result{margin-top:18px}.result a{color:#80a7ff}.files{padding-left:20px}.hint{font-size:13px;color:#8f97a6}
  </style>
</head>
<body>
<main><div class="card">
  <h1>⚡ DeepSeek Vibe Coder</h1>
  <p>Describe what you want changed. The agent reads the GitHub repository, asks DeepSeek to implement the change, creates a branch, commits the changes atomically, and opens a pull request.</p>
  <label for="endpoint">Worker URL</label>
  <input id="endpoint" placeholder="https://your-worker.workers.dev">
  <div class="hint">Paste the deployed Cloudflare Worker URL.</div>
  <label for="key">Agent key</label>
  <input id="key" type="password" placeholder="Your AGENT_KEY secret">
  <label for="repo">GitHub repository</label>
  <input id="repo" value="nezoko45-dev/deepseek-vibe-coder" placeholder="owner/repository">
  <label for="base">Base branch</label>
  <input id="base" value="main">
  <label for="task">What should DeepSeek build?</label>
  <textarea id="task" placeholder="Example: Add a responsive landing page with a dark theme and animated hero section."></textarea>
  <button id="run">🚀 Build with DeepSeek</button>
  <div id="status" class="status">Ready.</div>
  <div id="result" class="result"></div>
</div></main>
<script>
const $=id=>document.getElementById(id);
$("run").onclick=async()=>{
  const endpoint=$("endpoint").value.trim().replace(/\/$/,"");
  const key=$("key").value.trim();
  const repo=$("repo").value.trim();
  const base=$("base").value.trim()||"main";
  const task=$("task").value.trim();
  if(!endpoint||!key||!repo||!task){$("status").textContent="Please fill in the Worker URL, agent key, repository, and task.";return}
  $("run").disabled=true;$("status").textContent="DeepSeek is inspecting the repository and preparing the change…";$("result").innerHTML="";
  try{
    const r=await fetch(endpoint+"/vibe",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({repo,base,task})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Request failed");
    $("status").textContent="Build complete!";
    const files=(data.changes||[]).map(x=>`<li>${escapeHtml(x.action)}: ${escapeHtml(x.path)}</li>`).join("");
    $("result").innerHTML=`<h3>${escapeHtml(data.summary||"Changes created")}</h3><ul class="files">${files}</ul>${data.pullRequestUrl?`<p><a target="_blank" rel="noopener" href="${encodeURI(data.pullRequestUrl)}">Open pull request →</a></p>`:""}`;
  }catch(e){$("status").textContent="Build failed: "+e.message}
  finally{$("run").disabled=false}
};
function escapeHtml(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
</script>
</body>
</html>
