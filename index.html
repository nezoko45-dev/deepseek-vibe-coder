<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek Vibe Coder</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f4f6fa;min-height:100vh}main{max-width:1000px;margin:auto;padding:40px 20px}.card{background:#121620;border:1px solid #2b3240;border-radius:18px;padding:26px;box-shadow:0 16px 50px #0008}h1{margin:0 0 8px;font-size:30px}p{color:#aeb6c5;line-height:1.5}label{display:block;margin:18px 0 7px;font-weight:700}input,textarea{width:100%;background:#0b0e14;color:#fff;border:1px solid #343c4c;border-radius:10px;padding:12px;font:inherit}textarea{min-height:190px;resize:vertical}button{margin-top:18px;border:0;border-radius:10px;padding:13px 18px;background:#5b7cff;color:#fff;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:18px;padding:13px;border-radius:10px;background:#0b0e14;border:1px solid #262d39;white-space:pre-wrap}.result{margin-top:18px}.result a{color:#8ca8ff}.files{padding-left:22px}.hint{font-size:13px;color:#8d96a6}.ok{color:#91e6a1}.bad{color:#ff9292}.pill{display:inline-block;padding:4px 8px;border:1px solid #343c4c;border-radius:999px;font-size:12px;color:#aeb6c5}
</style>
</head>
<body>
<main><div class="card">
<h1>⚡ DeepSeek Vibe Coder</h1>
<p>Local browser UI for a DeepSeek-powered GitHub coding agent. The local backend reads the repository, asks DeepSeek to implement your task, creates a branch and commit, then opens a pull request.</p>
<div class="pill">Local backend · no Cloudflare</div>
<label for="repo">GitHub repository</label>
<input id="repo" value="nezoko45-dev/deepseek-vibe-coder" placeholder="owner/repository">
<label for="base">Base branch</label>
<input id="base" value="main">
<label for="task">What should DeepSeek build?</label>
<textarea id="task" placeholder="Example: Add a responsive landing page with a dark theme and animated hero section."></textarea>
<button id="run">🚀 Build with DeepSeek</button>
<div id="status" class="status">Checking local backend…</div>
<div id="result" class="result"></div>
</div></main>
<script>
const $=id=>document.getElementById(id);
async function check(){
  try{const r=await fetch('/');const d=await r.json();$("status").innerHTML=r.ok?'<span class="ok">● Backend online — ready.</span>':'<span class="bad">Backend responded with an error.</span>'}
  catch{$("status").innerHTML='<span class="bad">Backend is not running. Start the local server, then open this page through http://127.0.0.1:8787.</span>'}
}
$("run").onclick=async()=>{
 const repo=$("repo").value.trim(),base=$("base").value.trim()||"main",task=$("task").value.trim();
 if(!repo||!task){$("status").textContent="Enter a repository and a coding task first.";return}
 $("run").disabled=true;$("status").textContent="DeepSeek is reading the repository and building the change…";$("result").innerHTML="";
 try{
  const r=await fetch('/vibe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repo,base,task})});
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||'Request failed');
  $("status").innerHTML='<span class="ok">Build complete.</span>';
  const files=(data.changes||[]).map(x=>`<li><b>${escapeHtml(x.action)}</b>: ${escapeHtml(x.path)}</li>`).join('');
  $("result").innerHTML=`<h3>${escapeHtml(data.summary||'Changes created')}</h3><ul class="files">${files}</ul>${data.pullRequestUrl?`<p><a target="_blank" rel="noopener" href="${encodeURI(data.pullRequestUrl)}">Open pull request →</a></p>`:''}`;
 }catch(e){$("status").innerHTML='<span class="bad">Build failed: '+escapeHtml(e.message)+'</span>'}
 finally{$("run").disabled=false}
};
function escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
check();
</script>
</body>
</html>
